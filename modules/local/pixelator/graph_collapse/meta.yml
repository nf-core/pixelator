name: pixelator_graph_collapse
description: Run `pixelator single-cell-pna graph-collapse` on graph output data to collapse likely UMI sequencing errors on leaf nodes.
keywords:
  - pixelator
  - single-cell-pna
  - graph-collapse
  - umi
  - pxl
tools:
  - pixelator:
      description: Single-cell sequencing data analysis toolkit from Pixelgen Technologies.
      homepage: https://pixelgen.com/
      documentation: https://software.pixelgen.com/pixelator/
      licence: ["MIT"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'sample1' ]
    - data:
        type: file
        description: PXL file from the graph step. `meta.design` is passed as `--design`.
        ontologies: []
output:
  pixelfile:
    - - meta:
          type: map
          description: Groovy Map containing sample information.
      - "*.pxl":
          type: file
          description: Pixelator PXL output file.
          pattern: "*.pxl"
          ontologies: []
  report_json:
    - - meta:
          type: map
          description: Groovy Map containing sample information.
      - "*.report.json":
          type: file
          description: Run report in JSON format.
          pattern: "*.report.json"
          ontologies: []
  metadata_json:
    - - meta:
          type: map
          description: Groovy Map containing sample information.
      - "*.meta.json":
          type: file
          description: Metadata in JSON format.
          pattern: "*.meta.json"
          ontologies: []
  collapsed_sequences:
    - - meta:
          type: map
          description: Groovy Map containing sample information.
      - "*.collapsed_sequences.tsv":
          type: file
          description: Optional TSV listing each collapsed leaf UMI. Only written with `--report-collapsed-sequences`.
          pattern: "*.collapsed_sequences.tsv"
          ontologies: []
  all_results:
    - - meta:
          type: map
          description: Groovy Map containing sample information.
      - "*":
          type: directory
          description: All files generated in the graph-collapse output directory.
          pattern: "*"
          ontologies: []
  log:
    - - meta:
          type: map
          description: Groovy Map containing sample information.
      - "*pixelator-graph-collapse.log":
          type: file
          description: Pixelator graph-collapse command log.
          pattern: "*pixelator-graph-collapse.log"
          ontologies: []
  versions_pixelator:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from.
      - pixelator:
          type: string
          description: The tool name.
      - pixelator --version 2>/dev/null | sed 's/pixelator, version //g':
          type: eval
          description: The expression used to obtain the tool version.
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from.
      - pixelator:
          type: string
          description: The tool name.
      - pixelator --version 2>/dev/null | sed 's/pixelator, version //g':
          type: eval
          description: The expression used to obtain the tool version.
authors:
  - "@ptajvar"
maintainers:
  - "@ptajvar"
