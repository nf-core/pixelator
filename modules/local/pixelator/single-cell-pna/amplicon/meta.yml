name: pixelator_pna_amplicon
description: Run `pixelator single-cell-pna amplicon` on input FASTQ files.
keywords:
  - pixelator
  - single-cell-pna
  - amplicon
  - fastq
tools:
  - pixelator:
      description: Single-cell sequencing data analysis toolkit from Pixelgen Technologies.
      homepage: https://pixelgen.com/
      documentation: https://software.pixelgen.com/pixelator/
      licence: ["MIT"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'sample1' ]
    - reads:
        type: file
        description: Input FASTQ files.
        pattern: "*.{fq,fastq,fq.gz,fastq.gz,fq.zst,fastq.zst}"
        ontologies:
          - http://edamontology.org/format_2545
output:
  amplicon:
    - - meta:
          type: map
          description: Groovy Map containing sample information.
      - "*.amplicon.{fq,fastq}.zst":
          type: file
          description: Amplicon FASTQ output.
          pattern: "*.{fq,fastq}.zst"
          ontologies:
            - http://edamontology.org/format_2545
  report_json:
    - - meta:
          type: map
          description: Groovy Map containing sample information.
      - "*.report.json":
          type: file
          description: Run report in JSON format.
          pattern: "*.report.json"
          ontologies: []
  metadata_json:
    - - meta:
          type: map
          description: Groovy Map containing sample information.
      - "*.meta.json":
          type: file
          description: Metadata in JSON format.
          pattern: "*.meta.json"
          ontologies: []
  log:
    - - meta:
          type: map
          description: Groovy Map containing sample information.
      - "*pixelator-amplicon.log":
          type: file
          description: Pixelator amplicon command log.
          pattern: "*pixelator-amplicon.log"
          ontologies: []
  versions_pixelator:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from.
      - pixelator:
          type: string
          description: The tool name.
      - pixelator --version 2>/dev/null | sed 's/pixelator, version //g':
          type: eval
          description: The expression used to obtain the tool version.
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from.
      - pixelator:
          type: string
          description: The tool name.
      - pixelator --version 2>/dev/null | sed 's/pixelator, version //g':
          type: eval
          description: The expression used to obtain the tool version.
authors:
  - "@Aratz"
  - "@johandahlberg"
  - "@fbdtemme"
maintainers:
  - "@Aratz"
  - "@johandahlberg"
  - "@fbdtemme"
