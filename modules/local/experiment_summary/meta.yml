name: experiment_summary
description: Generate an HTML experiment summary report from pipeline outputs.
keywords:
  - report
  - quarto
  - summary
  - experiment
tools:
  - experiment-summary:
      description: Pixelator experiment summary report generation with pixelatorES.
      homepage: https://pixelgen.com/
      documentation: https://github.com/PixelgenTechnologies/pixelatorES
      licence: ["MIT"]
      identifier: ""
input:
  - - samplesheet_path:
        type: file
        description: Sample sheet used for the experiment.
        pattern: "*.{csv,tsv,txt}"
        ontologies: []
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'sample1' ]
    - result_stages:
        type: list
        description: Stage label for each file in `results_data` (same order).
        ontologies: []
    - results_data:
        type: file
        description: Result files to organize under stage folders in the report input.
        ontologies: []
  - - versions_yml:
        type: file
        description: Collated software versions, copied into the report data folder.
        pattern: "*.{yml,yaml}"
        ontologies: []
  - - es_workflow:
        type: string
        description: |
          Name of the pixelatorES workflow whose stage vocabulary matches the
          labels in `result_stages`, e.g. `edgelist_aggregate` for the edgelist /
          aggregate front end. Determines how the report interprets the staged
          stage folders.
output:
  html:
    - - meta:
          type: map
          description: Groovy Map containing sample information.
      - "*experiment-summary.html":
          type: file
          description: Generated experiment summary HTML report.
          pattern: "*experiment-summary.html"
          ontologies: []
  versions_experiment_summary:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from.
      - experiment-summary:
          type: string
          description: The tool name.
      - Rscript -e 'cat(as.character(packageVersion("pixelatorES")), "\n")':
          type: eval
          description: The expression used to obtain the tool version.
authors:
  - "@Aratz"
  - "@johandahlberg"
  - "@fbdtemme"
maintainers:
  - "@Aratz"
  - "@johandahlberg"
  - "@fbdtemme"
